name: Evaluate held-out 2015 data
on:
  push:
    paths:
      - evaluate_2015.py
      - .github/workflows/evaluate-2015.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible model dependencies
        run: python -m pip install 'scikit-learn==1.6.1' 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'joblib>=1.4,<2'
      - name: Evaluate untouched 2015 records
        run: python evaluate_2015.py
      - uses: actions/upload-artifact@v4
        with:
          name: held-out-2015-metrics
          path: evaluation_2015_results.json
